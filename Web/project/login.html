<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EpicQrizzz - Login & Registratie</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
  <div class="container">
    <div class="card shadow mx-auto p-4" style="max-width: 400px;">
      <h1 class="text-center mb-4">EpicQrizzz</h1>
      <div class="d-flex justify-content-center mb-3">
        <button id="login-tab" class="btn btn-primary me-2 active">Inloggen</button>
        <button id="register-tab" class="btn btn-outline-primary">Registreren</button>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="active">
        <input id="login-username" class="form-control mb-2" type="text" placeholder="Gebruikersnaam" required />
        <input id="login-password" class="form-control mb-2" type="password" placeholder="Wachtwoord" required />
        <button class="btn btn-success w-100" type="submit">Inloggen</button>
      </form>

      <!-- Registratie Form -->
      <form id="register-form" class="d-none">
        <input id="register-username" class="form-control mb-2" type="text" placeholder="Gebruikersnaam" required />
        <input id="register-password" class="form-control mb-2" type="password" placeholder="Wachtwoord" required />
        <input id="register-password2" class="form-control mb-2" type="password" placeholder="Herhaal wachtwoord" required />
        <button class="btn btn-success w-100" type="submit">Account aanmaken</button>
      </form>
    </div>
  </div>

  <script src="assets/js/login.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
