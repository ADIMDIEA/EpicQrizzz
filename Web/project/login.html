<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EpicQrizzz - Login & Registratie</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>EpicQrizzz</h1>

    <!-- Tabs -->
    <div class="tab-buttons">
      <button id="login-tab" class="active">Inloggen</button>
      <button id="register-tab">Registreren</button>
    </div>

    <!-- Login Form -->
    <form id="login-form" class="active">
      <input id="login-username" type="text" placeholder="Gebruikersnaam" required />
      <input id="login-password" type="password" placeholder="Wachtwoord" required />
      <button class="submit" type="submit">Inloggen</button>
    </form>

    <!-- Registratie Form -->
    <form id="register-form">
      <input id="register-username" type="text" placeholder="Gebruikersnaam" required />
      <input id="register-password" type="password" placeholder="Wachtwoord" required />
      <input id="register-password2" type="password" placeholder="Herhaal wachtwoord" required />
      <button class="submit" type="submit">Account aanmaken</button>
    </form>
  </div>

  <script>
    const loginTab = document.getElementById('login-tab');
    const registerTab = document.getElementById('register-tab');
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');

    // Tabs wisselen
    loginTab.addEventListener('click', () => {
      loginTab.classList.add('active');
      registerTab.classList.remove('active');
      loginForm.classList.add('active');
      registerForm.classList.remove('active');
    });

    registerTab.addEventListener('click', () => {
      registerTab.classList.add('active');
      loginTab.classList.remove('active');
      registerForm.classList.add('active');
      loginForm.classList.remove('active');
    });

    // UUID generator
    function generateId() {
      if (crypto.randomUUID) return crypto.randomUUID();
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        const v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    // SHA-256 hashing
    async function hashPassword(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Login API call
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('login-password').value;
      const username = document.getElementById('login-username').value.trim();

      try {
        const hashedPassword = await hashPassword(password);

        const res = await fetch(`http://joost.assenbergh.nl:5292/api/user/Login/${encodeURIComponent(username)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ enteredPassword: hashedPassword })
        });

        if (res.ok) {
          const data = await res.json();
          // alert('Welkom! Je account-ID is: ' + data.id); <-- Logging alert :D
          window.location.href = 'home.html';
        } else {
          const data = await res.json();
          alert('Login mislukt: ' + (data.message || res.statusText));
        }
      } catch (err) {
        console.error(err);
        alert('Er ging iets mis met inloggen');
      }
    });

    // Registratie API call
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('register-username').value.trim();
      const password = document.getElementById('register-password').value;
      const password2 = document.getElementById('register-password2').value;

      if (password !== password2) {
        alert('Wachtwoorden komen niet overeen!');
        return;
      }

      try {
        const id = generateId(); // unieke ID
        const hashedPassword = await hashPassword(password);

        const res = await fetch('http://joost.assenbergh.nl:5292/api/user/CreateAccount', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: id,
            name: username,
            password: hashedPassword
          })
        });

        if (res.ok) {
          // alert('Account aangemaakt! Je ID is: ' + id); <-- SignUp alert :D
          loginTab.click(); // switch naar login
        } else {
          const data = await res.json();
          alert('Registratie mislukt: ' + (data.message || res.statusText));
        }

      } catch (err) {
        console.error(err);
        alert('Er ging iets mis met registreren');
      }
    });
  </script>
</body>
</html>
