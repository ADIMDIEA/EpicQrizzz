<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EpicQrizzz - Inloggen</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column align-items-center justify-content-center vh-100 bg-light">

  <div class="card shadow p-4 text-center" style="max-width: 400px; width: 100%;">
    <!-- Logo toegevoegd -->
    <img src="assets/img/logo.png" alt="Logo" class="mb-3" style="max-width:120px; margin:auto;">
    
    <h3 class="mb-4">Inloggen</h3>
    <form id="login-form" class="text-start">
      <div class="mb-3">
        <label for="login-username" class="form-label">Gebruikersnaam</label>
        <input type="text" id="login-username" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="login-password" class="form-label">Wachtwoord</label>
        <input type="password" id="login-password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Inloggen</button>
    </form>
    <p class="mt-3">Nog geen account? <a href="register.html" class="text-primary">Registreren</a></p>
  </div>

  <script src="assets/js/login.js"></script>
</body>
</html>
