<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EpicQrizzz - Play</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="game-container">
    <div class="player">
      <div class="avatar" id="player-avatar">🙂</div>
      <div class="score" id="player-score">Score: 0</div>
    </div>

    <div class="quiz-area">
      <div class="quiz-question" id="quiz-question">Vraag wordt geladen...</div>
      <div class="timer" id="timer">10</div>
      <div class="answer-options" id="answer-options"></div>
      <button class="back-button" onclick="window.location.href='home.html'">Terug</button>
    </div>

    <div class="opponent">
      <div class="avatar">🤖</div>
      <div class="score" id="opponent-score">Score: 0</div>
    </div>
  </div>

  <script src="assets/js/play.js"></script>
</body>
</html>
