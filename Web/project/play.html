<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EpicQrizzz - Singleplayer Quiz</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column align-items-center justify-content-center vh-100 bg-light">

  <div class="card shadow-lg p-4 text-center w-100" style="max-width: 900px;">
    <!-- Logo -->
    <img src="assets/img/logo.png" alt="Logo" class="mb-4" style="max-width:140px; margin:auto;">

    <div class="row align-items-start">
      <!-- Speler -->
      <div class="col-md-3 mb-4 mb-md-0">
        <div class="display-1" id="player-avatar">🙂</div>
        <p id="player-name" class="fw-bold text-primary">Jij</p>
        <p class="fw-bold">Score: <span id="player-score">0</span></p>
      </div>

      <!-- Quiz -->
      <div class="col-md-6 mb-4 mb-md-0">
        <div class="p-4">
          <div class="h4 mb-3 text-primary" id="quiz-question">Vraag wordt geladen...</div>
          <div id="answer-options" class="d-grid gap-2"></div>
          <div id="result" class="mt-3"></div>
          <button class="btn btn-secondary mt-3" id="back-btn">Terug naar Home</button>
        </div>
      </div>

      <!-- Bot -->
      <div class="col-md-3">
        <div class="display-1" id="opponent-avatar">🤖</div>
        <p id="opponent-name" class="fw-bold text-primary">Bot</p>
        <p class="fw-bold">Score: <span id="opponent-score">0</span></p>
      </div>
    </div>
  </div>

  <script src="assets/js/play.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
