<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EpicQrizzz - 1v1 Quiz</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="game-container">
    <div class="player">
      <div class="avatar" id="player-avatar">🙂</div>
      <p id="player-name">Jij</p>
      <p class="score">Score: <span id="player-score">0</span></p>
    </div>

    <div class="quiz-area">
      <div class="timer" id="timer">30s</div>
      <div class="quiz-question" id="quiz-question">Vraag wordt geladen...</div>
      <div class="answer-options" id="answer-options"></div>
      <button class="back-button" id="back-btn">Terug naar Home</button>
    </div>

    <div class="opponent">
      <div class="avatar" id="opponent-avatar">😎</div>
      <p id="opponent-name">Tegenstander</p>
      <p class="score">Score: <span id="opponent-score">0</span></p>
    </div>
  </div>

  <!-- Verwijzing naar externe JS -->
  <script src="assets/js/play.js"></script>
</body>
</html>
