<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EpicQrizzz - 1v1 Quiz</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row text-center">
      <!-- Speler -->
      <div class="col-md-3">
        <div class="display-1" id="player-avatar">🙂</div>
        <p id="player-name">Jij</p>
        <p class="fw-bold">Score: <span id="player-score">0</span></p>
      </div>

      <!-- Quiz -->
      <div class="col-md-6">
        <div class="card p-4 shadow">
          <div class="h5 text-end" id="timer">30s</div>
          <div class="h4 mb-3" id="quiz-question">Vraag wordt geladen...</div>
          <div id="answer-options" class="d-grid gap-2"></div>
          <button class="btn btn-secondary mt-3" id="back-btn">Terug naar Home</button>
        </div>
      </div>

      <!-- Tegenstander -->
      <div class="col-md-3">
        <div class="display-1" id="opponent-avatar">😎</div>
        <p id="opponent-name">Tegenstander</p>
        <p class="fw-bold">Score: <span id="opponent-score">0</span></p>
      </div>
    </div>
  </div>

  <script src="assets/js/play.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
