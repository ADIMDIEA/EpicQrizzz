<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EpicQrizzz - 1v1 Quiz</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .game-container {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      gap: 20px;
      width: 90%;
      max-width: 1000px;
      margin: 40px auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      padding: 30px;
      align-items: start;
    }

    .player, .opponent {
      text-align: center;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #BBDEFB;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      color: #1976D2;
      margin: 0 auto 10px;
    }

    .score {
      font-size: 1.2rem;
      font-weight: bold;
      color: #1976D2;
      margin-top: 5px;
    }

    .quiz-area {
      text-align: center;
    }

    .quiz-question {
      font-size: 1.5rem;
      margin-bottom: 20px;
      font-weight: bold;
      color: #1976D2;
    }

    .timer {
      font-size: 1.2rem;
      font-weight: bold;
      color: #E53935;
      margin-bottom: 15px;
    }

    .answer-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    .answer-options button {
      padding: 15px;
      border-radius: 12px;
      border: none;
      background: #42A5F5;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
    }

    .answer-options button:hover {
      background: #1E88E5;
      transform: scale(1.05);
    }

    .back-button {
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      background: #E53935;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
      display: block;
      margin: 0 auto;
    }

    .back-button:hover {
      background: #C62828;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="player">
      <div class="avatar" id="player-avatar">🙂</div>
      <p id="player-name">Jij</p>
      <p class="score">Score: <span id="player-score">0</span></p>
    </div>

    <div class="quiz-area">
      <div class="timer" id="timer">30s</div>
      <div class="quiz-question" id="quiz-question">Vraag wordt geladen...</div>
      <div class="answer-options" id="answer-options"></div>
      <button class="back-button" id="back-btn">Terug naar Home</button>
    </div>

    <div class="opponent">
      <div class="avatar" id="opponent-avatar">😎</div>
      <p id="opponent-name">Tegenstander</p>
      <p class="score">Score: <span id="opponent-score">0</span></p>
    </div>
  </div>

  <!-- Verwijzing naar externe JS -->
  <script src="play.js"></script>
</body>
</html>
