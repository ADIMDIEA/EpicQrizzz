<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>EpicQrizzz - Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
  <div class="container">
    <div class="card shadow p-4">
      <h1 class="text-center mb-4">Admin - Voeg Vraag Toe</h1>

      <!-- Vraag invoeren -->
      <div class="mb-3">
        <label for="questionText" class="form-label">Vraag</label>
        <input type="text" id="questionText" class="form-control" placeholder="Bijv. Wat is de hoofdstad van Frankrijk?">
      </div>

      <!-- Meerkeuze opties -->
      <div class="mb-3">
        <label for="optionA" class="form-label">Optie A</label>
        <input type="text" id="optionA" class="form-control" placeholder="Bijv. Parijs">
      </div>
      <div class="mb-3">
        <label for="optionB" class="form-label">Optie B</label>
        <input type="text" id="optionB" class="form-control" placeholder="Bijv. Londen">
      </div>
      <div class="mb-3">
        <label for="optionC" class="form-label">Optie C</label>
        <input type="text" id="optionC" class="form-control" placeholder="Bijv. Rome">
      </div>
      <div class="mb-3">
        <label for="optionD" class="form-label">Optie D</label>
        <input type="text" id="optionD" class="form-control" placeholder="Bijv. Madrid">
      </div>

      <!-- Correct antwoord -->
      <div class="mb-3">
        <label for="correctAnswer" class="form-label">Correct Antwoord (A, B, C of D)</label>
        <input type="text" id="correctAnswer" class="form-control" placeholder="Bijv. A">
      </div>

      <button id="addQuestion" class="btn btn-success w-100">Vraag Toevoegen</button>

      <p id="result" class="mt-3 fw-bold text-center"></p>
    </div>
  </div>

  <!-- Koppeling naar JS bestand -->
  <script src="admin.js"></script>
  <script src="assets/js/logo.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
