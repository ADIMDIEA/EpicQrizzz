<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EpicQrizzz - Leaderboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column align-items-center justify-content-center vh-100 bg-light">

  <!-- Leaderboard Card -->
  <div class="card shadow p-4 text-center" style="max-width: 600px; width: 100%;">
    <!-- Logo -->
    <img src="assets/img/logo.png" alt="EpicQrizzz Logo" class="mb-3" style="max-width: 120px; margin: auto;">

    <h3 class="text-primary mb-3">
      <i class="bi bi-trophy-fill text-warning"></i> Leaderboard
    </h3>
    <p class="text-muted mb-4">Bekijk wie de meeste munten heeft verzameld!</p>

    <!-- Leaderboard Table -->
    <div class="table-responsive">
      <table class="table table-hover text-center align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th scope="col">#</th>
            <th scope="col">Gebruiker</th>
            <th scope="col">Munten</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body">
          <!-- Dynamisch gevuld via JS -->
        </tbody>
      </table>
    </div>

    <!-- Welcome text + Logout -->
    <div class="mt-4 d-flex justify-content-between align-items-center">
      <span id="welcome-text">🙂 Hallo!</span>
      <button class="btn btn-outline-danger btn-sm" id="logout-btn">Uitloggen</button>
    </div>

    <!-- Terug naar home -->
    <div class="mt-3">
      <a href="home.html" class="btn btn-link text-primary text-decoration-none">
        <i class="bi bi-arrow-left-circle"></i> Terug naar Home
      </a>
    </div>
  </div>

  <script src="assets/js/leaderboard.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
