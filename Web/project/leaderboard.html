<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EpicQrizzz - Leaderboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="home.html">
        <img src="assets/img/logo.png" alt="EpicQrizzz Logo" style="height:40px; margin-right:10px;">
        <span class="text-primary fw-bold">EpicQrizzz</span>
      </a>
      <div class="d-flex align-items-center">
        <span class="me-3" id="welcome-text">🙂 Hallo!</span>
        <button class="btn btn-outline-danger" id="logout-btn">Uitloggen</button>
      </div>
    </div>
  </nav>

  <!-- Leaderboard Content -->
  <div class="container my-5">
    <h2 class="text-center text-primary mb-4">
      <i class="bi bi-trophy-fill text-warning"></i> Leaderboard
    </h2>
    <p class="text-center text-muted">Bekijk wie de meeste munten heeft verzameld!</p>

    <div class="card shadow-sm">
      <div class="card-body">
        <table class="table table-hover text-center align-middle">
          <thead class="table-light">
            <tr>
              <th scope="col">#</th>
              <th scope="col">Gebruiker</th>
              <th scope="col">Munten</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body">
            <!-- Dynamisch gevuld via JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="assets/js/leaderboard.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
