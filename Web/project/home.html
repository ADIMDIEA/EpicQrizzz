<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EpicQrizzz - Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --bs-primary: #E72B76; }
    .btn-primary { background-color: var(--bs-primary) !important; border-color: var(--bs-primary) !important; }
    .btn-primary:hover { background-color: #c91d65 !important; border-color: #c91d65 !important; }
    .text-primary { color: var(--bs-primary) !important; }
  </style>
</head>
<body class="d-flex flex-column align-items-center justify-content-center vh-100 bg-light">
  <div class="text-center">
    <h1 class="mb-4">Welkom bij <span class="text-primary">EpicQrizzz</span> <span id="avatar-display">🙂</span></h1>

    <button class="btn btn-primary w-100 mb-2" onclick="window.location.href='multiplayerdashboard.html'">Multiplayer</button>
    <button class="btn btn-primary w-100 mb-2" onclick="window.location.href='play.html'">Single player</button>
    <button class="btn btn-primary w-100 mb-2" onclick="window.location.href='leaderboard.html'">Leaderboard</button>
    <button class="btn btn-primary w-100 mb-2" onclick="window.location.href='profile.html'">Profiel</button>
    <button class="btn btn-primary w-100 mb-2" onclick="window.location.href='store.html'">Store</button>
    
    <!-- Alleen zichtbaar voor admin -->
    <button class="btn btn-warning w-100 mb-2 d-none" id="admin-btn" onclick="window.location.href='admin.html'">Admin Panel</button>
    
    <button class="btn btn-danger w-100" id="logout-btn">Uitloggen</button>
  </div>

  <script src="home.js"></script>
  <script>
    document.getElementById("logout-btn").addEventListener("click", function() {
      window.location.href = "index.html";
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/logo.js"></script>

</body>
</html>
