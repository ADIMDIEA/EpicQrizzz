<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Lobby</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    input { padding: 8px; margin: 5px 0; display: block; width: 200px; }
    button { padding: 8px 12px; cursor: pointer; margin-top: 10px; }
    #status { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Join or Create a Room</h2>

  <label for="roomCode">Room Code:</label>
  <input type="text" id="roomCode" placeholder="e.g. ABCA">

  <button onclick="joinRoom()">Join/Create Room</button>

  <div id="status"></div>

  <script>
    async function joinRoom() {
      const room = document.getElementById("roomCode").value.trim().toUpperCase();

      // ✅ get UUID from sessionStorage
      const userUUID = sessionStorage.getItem("epicqrizzz-userId");

      if (!room) {
        alert("Please enter a room code!");
        return;
      }
      if (!userUUID) {
        alert("UUID not found in sessionStorage!");
        return;
      }

      try {
        const res = await fetch("http://joost.assenbergh.nl:5293/api/Game/JoinOrAdd", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            room: room,
            userId: userUUID,
            score: "0"
          })
        });

        const responseText = await res.text(); // API returns plain text
        console.log("Room response:", responseText);

        // Redirect to multiplayer2.html with room code and UUID
        window.location.href = `multiplayer2.html?room=${room}&user=${userUUID}`;
      } catch (err) {
        console.error("Error joining room:", err);
        document.getElementById("status").innerHTML =
          `<span style="color:red">❌ Failed to join room</span>`;
      }
    }
  </script>
</body>
</html>
