<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EpicQrizzz - Multiplayer Room</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
  <div class="text-center mb-4">
    <h2 id="roomInfo" class="fw-bold text-primary">Multiplayer Room</h2>
  </div>

  <div class="row">
    <!-- Quiz Card -->
    <div class="col-md-8">
      <div class="card shadow p-4 mb-4">
        <div class="h4 mb-3 text-primary" id="quiz">Vraag wordt geladen...</div>
        <div id="result" class="mb-3"></div>
        <div class="d-flex gap-2">
          <button class="btn btn-primary" onclick="submitAnswer()">Verstuur antwoord</button>
        </div>
      </div>
    </div>

    <!-- Players Table -->
    <div class="col-md-4">
      <div class="card shadow p-4 mb-4">
        <h5 class="fw-bold text-primary">Spelers in de kamer</h5>
        <div class="table-responsive">
          <table class="table table-bordered text-center mt-3">
            <thead class="table-light">
              <tr>
                <th>Speler</th>
                <th>Score</th>
              </tr>
            </thead>
            <tbody id="playersTableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Endgame Top 3 -->
      <div class="card shadow p-4 mt-4" id="endGameCard" style="display:none;">
        <h5 class="fw-bold text-primary">🏆 Top 3 Spelers</h5>
        <ul id="top3List" class="list-group mt-3"></ul>
      </div>
    </div>
  </div>
</div>

<!-- Externe JS -->
<script src="assets/js/multiplayer2.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
