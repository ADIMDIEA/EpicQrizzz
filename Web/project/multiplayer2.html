<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EpicQrizzz - Multiplayer Room</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --bs-primary: #E72B76; }
    .btn-primary { background-color: var(--bs-primary) !important; border-color: var(--bs-primary) !important; }
    .btn-primary:hover { background-color: #c91d65 !important; border-color: #c91d65 !important; }
    .text-primary { color: var(--bs-primary) !important; }
    body { background-color: #f8f9fa; }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="text-center mb-4">
      <h2 id="roomInfo" class="fw-bold text-primary">Multiplayer Room</h2>
    </div>

    <div class="row">
      <!-- Quiz Card -->
      <div class="col-md-8">
        <div class="card shadow p-4 mb-4">
          <div class="h4 mb-3 text-primary" id="quiz">Vraag wordt geladen...</div>
          <div id="result" class="mb-3"></div>
        </div>
      </div>

      <!-- Players Table -->
      <div class="col-md-4">
        <div class="card shadow p-4">
          <h5 class="fw-bold text-primary">Spelers in de kamer</h5>
          <div class="table-responsive">
            <table class="table table-bordered text-center mt-3">
              <thead class="table-light">
                <tr>
                  <th>Speler</th>
                  <th>Score</th>
                </tr>
              </thead>
              <tbody id="playersTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Top 3 Section -->
    <div class="card shadow p-4 mt-4" id="top3Card" style="display:none;">
      <h5 class="fw-bold text-primary">🏆 Top 3 Spelers</h5>
      <ul id="top3List" class="list-group mt-3"></ul>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const room = urlParams.get("room");
    const userUUID = urlParams.get("user");

    if (!room || !userUUID) alert("Missing room or user information!");

    document.getElementById("roomInfo").innerText = `Room: ${room} | User: ${userUUID}`;

    let currentQuestionId = null;

    async function loadQuestion() {
      try {
        const res = await fetch(`http://joost.assenbergh.nl:5293/api/Game/GetGameQuestion/${userUUID}`);

        if (res.status === 400) {
          document.getElementById("quiz").innerHTML = `<p class="text-primary fw-bold">🎉 Je hebt alle vragen beantwoord!</p>`;
          document.getElementById("result").innerHTML = "";

          // Check end game
          endGame();
          return;
        }

        const data = await res.json();
        currentQuestionId = data.id;

        const quizContainer = document.getElementById("quiz");
        quizContainer.innerHTML = "";

        const q = document.createElement("div");
        q.className = "mb-3 fw-bold";
        q.innerText = data.questionText;
        quizContainer.appendChild(q);

        data.options.slice(0,6).forEach(opt => {
          const div = document.createElement("div");
          div.className = "form-check";

          const radio = document.createElement("input");
          radio.type = "radio";
          radio.name = "answer";
          radio.value = opt.option.toLowerCase();
          radio.className = "form-check-input";

          const label = document.createElement("label");
          label.className = "form-check-label";
          label.innerText = opt.awnserText;

          div.appendChild(radio);
          div.appendChild(label);
          quizContainer.appendChild(div);
        });
      } catch (err) {
        console.error("Error loading question:", err);
        document.getElementById("quiz").innerText = "❌ Kon de vraag niet laden.";
      }
    }

    async function submitAnswer() {
      const selected = document.querySelector("input[name='answer']:checked");
      if (!selected) {
        alert("Kies een antwoord!");
        return;
      }

      const chosenOption = selected.value;

      try {
        const res = await fetch(`http://joost.assenbergh.nl:5293/api/Game/CheckGameAnswer/${userUUID}/${currentQuestionId}/${chosenOption}`);
        const data = await res.json();

        const resultDiv = document.getElementById("result");
        if (data.isCorrect) {
          resultDiv.innerHTML = `<p class="text-success fw-bold">✅ Correct!</p>`;
        } else {
          resultDiv.innerHTML = `<p class="text-danger fw-bold">❌ Fout!</p>`;
        }

        updatePlayers();

        // Automatisch volgende vraag na 1 sec
        setTimeout(() => {
          resultDiv.innerHTML = "";
          loadQuestion();
        }, 1000);

      } catch (err) {
        console.error("Error checking answer:", err);
        document.getElementById("result").innerHTML = `<p class="text-danger fw-bold">❌ Kon antwoord niet checken</p>`;
      }
    }

    async function updatePlayers() {
      try {
        const res = await fetch(`http://joost.assenbergh.nl:5293/api/Game/GetRoom/${room}`);
        const players = await res.json();

        const tbody = document.getElementById("playersTableBody");
        tbody.innerHTML = "";

        players.forEach(p => {
          const row = document.createElement("tr");
          row.innerHTML = `<td>${p.userId}</td><td><span class="fw-bold">${p.score}</span></td>`;
          tbody.appendChild(row);
        });
      } catch (err) {
        console.error("Error fetching players:", err);
      }
    }

    // Auto-refresh spelerslijst elke 5 sec
    setInterval(updatePlayers, 5000);

    // End game en toon top 3
    async function endGame() {
      try {
        const res = await fetch(`http://joost.assenbergh.nl:5293/api/Game/EndGame/${userUUID}`);
        const data = await res.json();

        const top3Card = document.getElementById("top3Card");
        const top3List = document.getElementById("top3List");

        top3List.innerHTML = "";
        data.top3.forEach(player => {
          const li = document.createElement("li");
          li.className = "list-group-item fw-bold";
          li.innerText = `${player.name} - ${player.score} punten`;
          top3List.appendChild(li);
        });

        top3Card.style.display = "block";

      } catch (err) {
        console.error("Error ending game:", err);
      }
    }

    // Initial load
    loadQuestion();
    updatePlayers();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
