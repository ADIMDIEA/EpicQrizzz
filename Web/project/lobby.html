<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EpicQrizzz - Lobby</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <div class="text-center mb-4">
      <h2 id="roomInfo" class="fw-bold text-primary">Lobby</h2>
    </div>

    <div class="card shadow p-4 mb-4">
      <h5 class="fw-bold text-primary">Spelers in de kamer</h5>
      <ul id="playersList" class="list-group mt-3"></ul>

      <div class="mt-3">
        <label for="numQuestions" class="form-label fw-bold text-primary">Aantal vragen (max 100):</label>
        <input type="number" id="numQuestions" class="form-control" min="1" max="100" value="10">
      </div>

      <div class="mt-3">
        <button id="startBtn" class="btn btn-primary">Start Game</button>
      </div>
      <div id="status" class="mt-3"></div>
    </div>
  </div>

  <script src="assets/js/lobby.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
