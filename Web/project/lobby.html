<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EpicQrizzz - Lobby</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --bs-primary: #E72B76; }
    .btn-primary { background-color: var(--bs-primary) !important; border-color: var(--bs-primary) !important; }
    .btn-primary:hover { background-color: #c91d65 !important; border-color: #c91d65 !important; }
    .text-primary { color: var(--bs-primary) !important; }
    body { background-color: #f8f9fa; }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="text-center mb-4">
      <h2 id="roomInfo" class="fw-bold text-primary">Lobby</h2>
    </div>

    <div class="card shadow p-4 mb-4">
      <h5 class="fw-bold text-primary">Spelers in de kamer</h5>
      <ul id="playersList" class="list-group mt-3"></ul>
      <div class="mt-3">
        <button id="startBtn" class="btn btn-primary">Start Game</button>
      </div>
      <div id="status" class="mt-3"></div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const room = urlParams.get("room");
    const userUUID = urlParams.get("user");

    if (!room || !userUUID) alert("Missing room or user info!");

    document.getElementById("roomInfo").innerText = `Lobby - Room: ${room}`;

    const playersList = document.getElementById("playersList");
    const statusDiv = document.getElementById("status");
    const startBtn = document.getElementById("startBtn");

    // Fetch players
    async function updatePlayers() {
      try {
        const res = await fetch(`http://joost.assenbergh.nl:5293/api/Game/GetRoom/${room}`);
        const players = await res.json();

        playersList.innerHTML = "";
        players.forEach(p => {
          const li = document.createElement("li");
          li.className = "list-group-item";
          li.innerText = p.userId;
          playersList.appendChild(li);
        });
      } catch (err) {
        console.error("Error fetching players:", err);
      }
    }

    // Start game
    startBtn.addEventListener("click", async () => {
      try {
        const res = await fetch("http://joost.assenbergh.nl:5293/api/Game/StartGame", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(userUUID)
        });

        // Alleen tonen als er een fout is
        if (!res.ok) {
          const text = await res.text();
          statusDiv.innerText = text;
        }

        // Geen bericht bij succes; redirect gebeurt automatisch via polling
      } catch (err) {
        console.error("Error starting game:", err);
        statusDiv.innerText = "❌ Kon het spel niet starten";
      }
    });

    // Poll if game started
    async function checkGameStarted() {
      try {
        const res = await fetch(`http://joost.assenbergh.nl:5293/api/Game/IsGameStarted/${userUUID}`);
        const data = await res.json();
        if (data.started) {
          window.location.href = `multiplayer2.html?room=${room}&user=${userUUID}`;
        }
      } catch (err) {
        console.error("Error checking game status:", err);
      }
    }

    // Auto-refresh players and check game start every 2 sec
    setInterval(updatePlayers, 2000);
    setInterval(checkGameStarted, 2000);

    // Initial load
    updatePlayers();
    checkGameStarted();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
