<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EpicQrizzz - Multiplayer Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --bs-primary: #E72B76; }
    .btn-primary { 
      background-color: var(--bs-primary) !important; 
      border-color: var(--bs-primary) !important; 
    }
    .btn-primary:hover { 
      background-color: #c91d65 !important; 
      border-color: #c91d65 !important; 
    }
    .btn-outline-primary {
      color: var(--bs-primary) !important;
      border-color: var(--bs-primary) !important;
    }
    .btn-outline-primary:hover {
      background-color: var(--bs-primary) !important;
      color: #fff !important;
    }
    .text-primary { color: var(--bs-primary) !important; }
    body {
      background: linear-gradient(135deg, #fff 0%, #ffe6f0 100%);
    }
    .card {
      border-radius: 1.5rem;
    }
  </style>
</head>
<body class="d-flex flex-column align-items-center justify-content-center vh-100">
  <div class="card shadow-lg p-4 text-center" style="max-width: 500px; width: 100%;">
    <h1 class="mb-4">Multiplayer <span class="text-primary">Dashboard</span> ⚡</h1>
    <p class="mb-4 text-muted">Kies of je een spel wilt hosten of meedoen met een bestaand spel.</p>

    <button class="btn btn-primary w-100 mb-3" onclick="window.location.href='host.html'">Spel Hosten</button>
    <button class="btn btn-outline-primary w-100 mb-3" onclick="window.location.href='../multiplayer.html'">Spel Joinen</button>
    
    <hr class="my-4">
    
    <button class="btn btn-secondary w-100" onclick="window.location.href='home.html'">⬅️ Terug naar Home</button>
  </div>

  <script src="assets/js/logo.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
