<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EpicQrizzz - Multiplayer Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">

</head>
<body class="d-flex flex-column align-items-center justify-content-center vh-100 bg-light">
  <div class="card shadow-lg p-4 text-center" style="max-width: 500px; width: 100%;">
    <img src="assets/img/logo.png" alt="Logo" class="mb-3" style="max-width:150px; margin:auto;">
    
    <h1 class="mb-3">Multiplayer <span class="text-primary">Dashboard</span> ⚡</h1>

    <!-- Join/Create Room Form -->
    <div class="mb-3 text-start">
      <label for="roomCode" class="form-label fw-bold">Room Code:</label>
      <input type="text" id="roomCode" class="form-control" placeholder="e.g. ABCA">
    </div>

    <button id="joinBtn" class="btn btn-primary w-100 mb-3">Join/Create Room</button>
    <div id="status" class="mt-2 fw-bold"></div>

    <hr class="my-4">
    <button class="btn btn-secondary w-100" onclick="window.location.href='home.html'">⬅️ Terug naar Home</button>
  </div>

  <script src="assets/js/multiplayerdashboard.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
