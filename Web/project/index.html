<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>EpicQrizzz - Backend Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
  <div class="container">
    <div class="card shadow p-4">
      <h1 class="text-center mb-4">Frontend → C# Backend</h1>

      <div class="mb-3">
        <label for="quetionId" class="form-label">Vraag ID</label>
        <input type="number" id="quetionId" class="form-control" placeholder="Bijv. 1">
      </div>

      <button id="Ask" class="btn btn-primary w-100 mb-3">Vraag ophalen</button>

      <div class="mb-3">
        <h4 id="quetion" class="mb-3">Vraag komt hier...</h4>
        <ul class="list-group">
          <li id="optionA" class="list-group-item"></li>
          <li id="optionB" class="list-group-item"></li>
          <li id="optionC" class="list-group-item"></li>
          <li id="optionD" class="list-group-item"></li>
        </ul>
      </div>

      <div class="mb-3">
        <label for="check" class="form-label">Jouw antwoord (A, B, C, D)</label>
        <input type="text" id="check" class="form-control" placeholder="Bijv. A">
      </div>

      <button id="send" class="btn btn-success w-100">Controleer antwoord</button>

      <p id="awnser" class="mt-3 fw-bold text-center"></p>
    </div>
  </div>

  <script>
    const questionIdInput = document.getElementById("quetionId");
    const askBtn = document.getElementById("Ask");
    const checkInput = document.getElementById("check");
    const sendBtn = document.getElementById("send");

    askBtn.addEventListener("click", async () => {
      try {
        let res = await fetch(`https://localhost:7112/api/Quetion/GetById/${questionIdInput.value}`);
        let data = await res.json();

        document.getElementById("quetion").innerHTML = data.questionText;
        document.getElementById("optionA").innerHTML = "A = " + data.optionA;
        document.getElementById("optionB").innerHTML = "B = " + data.optionB;
        document.getElementById("optionC").innerHTML = "C = " + data.optionC;
        document.getElementById("optionD").innerHTML = "D = " + data.optionD;
      } catch (err) {
        console.error("Error:", err);
      }
    });

    sendBtn.addEventListener("click", async () => {
      try {
        let res = await fetch(`https://localhost:7112/api/Quetion/CheckAwnser/${questionIdInput.value}/${checkInput.value}`);
        let data = await res.json();

        document.getElementById("awnser").innerHTML = data ? "✅ CORRECT" : "❌ FOUT";
        document.getElementById("awnser").className = data ? "text-success fw-bold text-center" : "text-danger fw-bold text-center";
      } catch (err) {
        console.error("Error:", err);
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
