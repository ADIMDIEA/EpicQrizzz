<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JS Frontend</title>
</head>
<body>
    <h1>Frontend talking to C# Backend</h1>
    <input type="number" id="quetionId" name="name">

    <button id="Ask">krijg vraag</button>
    <p id="quetion"></p>
    <li id="optionA"></li>
    <li id="optionB"></li>
    <li id="optionC"></li>
    <li id="optionD"></li>


    <input type="text" id="check" name="name">
    <button id="send">send</button>

    <p id="awnser"></p>
    <script>



    document.getElementById("Ask").addEventListener("click", async () => {
        try {
        let res = await fetch(`https://localhost:7112/api/Quetion/GetById/${quetionId.value}`);
        let data = await res.json();

        console.log(data.questionText);
        document.getElementById("quetion").innerHTML = data.questionText;
        document.getElementById("optionA").innerHTML = "A = " + data.optionA;
        document.getElementById("optionB").innerHTML = "B = " + data.optionB;
        document.getElementById("optionC").innerHTML = "C = " + data.optionC;
        document.getElementById("optionD").innerHTML = "D = " + data.optionD;


        } catch (err) {
        console.error("Error:", err);
        }
    });

    document.getElementById("send").addEventListener("click", async () => {
        try {
        let res = await fetch(`https://localhost:7112/api/Quetion/CheckAwnser/${quetionId.value}/${check.value}`);
        let data = await res.json();
        console.log(data);
        if (data){document.getElementById("awnser").innerHTML = "CORRECT";}
        else{document.getElementById("awnser").innerHTML = "FOUT";}

        } catch (err) {
        console.error("Error:", err);
        }
    });



  </script>



</body>
</html>
