<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EpicQrizzz - Store</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="text-center mb-5">
      <h1>Welkom in de Store 🛒</h1>
      <p class="lead">Hier kun je nieuwe avatars, thema’s of andere extra’s kopen (toekomstige uitbreiding).</p>
    </div>

    <div class="row">
      <div class="col-md-4 mb-3">
        <div class="card h-100 shadow">
          <div class="card-body text-center">
            <h5 class="card-title">Avatar Pack 1</h5>
            <p class="card-text">Kies uit 5 nieuwe emoji avatars.</p>
            <button class="btn btn-primary">Kopen</button>
          </div>
        </div>
      </div>

      <div class="col-md-4 mb-3">
        <div class="card h-100 shadow">
          <div class="card-body text-center">
            <h5 class="card-title">Thema Pack</h5>
            <p class="card-text">Ontgrendel een donker thema voor je quiz.</p>
            <button class="btn btn-primary">Kopen</button>
          </div>
        </div>
      </div>

      <div class="col-md-4 mb-3">
        <div class="card h-100 shadow">
          <div class="card-body text-center">
            <h5 class="card-title">Extra Quizvragen</h5>
            <p class="card-text">Breid je quiz uit met 100+ nieuwe vragen.</p>
            <button class="btn btn-primary">Kopen</button>
          </div>
        </div>
      </div>
    </div>

    <div class="text-center mt-4">
      <button class="btn btn-secondary" onclick="window.location.href='home.html'">Terug naar Home</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
