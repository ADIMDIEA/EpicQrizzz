<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EpicQrizzz - Registreren</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column align-items-center justify-content-center vh-100 bg-light">

  <div class="card shadow p-4 text-center" style="max-width: 400px; width: 100%;">
    <!-- Logo toegevoegd -->
    <img src="assets/img/logo.png" alt="Logo" class="mb-3" style="max-width:120px; margin:auto;">

    <h3 class="mb-4">Registreren</h3>
    <form id="register-form" class="text-start">
      <div class="mb-3">
        <label for="register-username" class="form-label">Gebruikersnaam</label>
        <input type="text" id="register-username" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="register-password" class="form-label">Wachtwoord</label>
        <input type="password" id="register-password" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="register-password2" class="form-label">Herhaal wachtwoord</label>
        <input type="password" id="register-password2" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Account aanmaken</button>
    </form>
    <p class="mt-3">Heb je al een account? <a href="login.html" class="text-primary">Inloggen</a></p>
  </div>

  <script src="assets/js/register.js"></script>
</body>
</html>
